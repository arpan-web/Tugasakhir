[providers]
name = ['php', 'node']

[phases.setup]
nixPkgs = ['php82', 'php82Extensions.pdo_mysql', 'php82Extensions.mbstring', 'composer', 'nodejs_20']

[phases.install]
cmds = [
  'composer install --ignore-platform-reqs --no-dev --optimize-autoloader',
  'npm install'
]

[phases.build]
cmds = [
  'npm run build'
]

[start]
cmd = 'php artisan config:clear && php artisan migrate --force && php artisan serve --host 0.0.0.0 --port $PORT'
